name: Documentation Validation

on:
  pull_request:
    paths:
      - "sambanas/**"
      - "sambanas2/**"
      - "plex/**"
      - "RPiMySensor/**"
      - "addon-plex/**"
    types: [opened, synchronize, reopened]

jobs:
  validate-documentation:
    runs-on: ubuntu-latest
    name: Validate Documentation Updates

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            sambanas/**
            sambanas2/**
            plex/**
            RPiMySensor/**
            addon-plex/**
          files_ignore: |
            **/*.md
            **/*.txt
            **/*.yml
            **/*.yaml

      - name: Check for documentation updates
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"

          # Extract project directories from changed files
          projects=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' | cut -d'/' -f1 | sort -u)

          echo "Affected projects: $projects"

          # Check if documentation files were also modified in the same PR
          doc_check_failed=false

          for project in $projects; do
            echo "Checking documentation for project: $project"
            
            # Check if any .md files in the project were modified
            md_files_changed=$(git diff --name-only origin/${{ github.base_ref }}..HEAD | grep "^$project/.*\.md$" || true)
            changelog_changed=$(git diff --name-only origin/${{ github.base_ref }}..HEAD | grep "^$project/CHANGELOG.md$" || true)

            if [ -z "$md_files_changed" ]; then
              echo "❌ ERROR: Changes detected in $project but no .md files were updated!"
              echo "Please update the following files as needed:"
              echo "  - $project/README.md"
              echo "  - $project/DOCS.md (if it exists)"
              echo "  - $project/CHANGELOG.md (if it exists)"
              doc_check_failed=true
            else
              echo "✅ Documentation files updated for $project:"
              echo "$md_files_changed"
              if [ -z "$changelog_changed" ]; then
                echo "⚠️ WARNING: $project/CHANGELOG.md was not updated in this PR."
                echo "   The opencode-changelog workflow maintains ## Unreleased automatically,"
                echo "   but verify the entry exists before merging."
              fi
            fi
          done

          if [ "$doc_check_failed" = true ]; then
            echo ""
            echo "📋 Documentation Update Requirements:"
            echo "1. Update README.md if features, installation, or requirements changed"
            echo "2. Update DOCS.md if configuration options or usage changed"
            echo "3. Update CHANGELOG.md with a description of your changes"
            echo "4. Ensure no cross-project references are introduced"
            echo ""
            echo "See AGENTS.md for detailed guidelines."
            exit 1
          fi

      - name: Validate markdown files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Check for cross-project references in user-facing documentation.
          # Only README.md, DOCS.md and CHANGELOG.md are scanned: internal
          # guidance such as AGENTS.md must name other projects to forbid
          # copying between them. Only projects touched by this PR are
          # checked so legacy references in untouched add-ons don't block
          # unrelated releases.
          echo "Checking for cross-project references..."

          affected=$(git diff --name-only origin/${{ github.base_ref }}..HEAD | cut -d'/' -f1 | sort -u)
          echo "Affected top-level paths: $affected"

          cross_ref_found=false
          projects=("sambanas" "sambanas2" "plex" "RPiMySensor" "addon-plex")
          docs_files=("README.md" "DOCS.md" "CHANGELOG.md")

          for project in "${projects[@]}"; do
            if ! echo "$affected" | grep -qx "$project"; then
              echo "Skipping untouched project: $project"
              continue
            fi
            if [ ! -d "$project" ]; then
              continue
            fi
            for doc in "${docs_files[@]}"; do
              md_file="$project/$doc"
              if [ ! -f "$md_file" ]; then
                continue
              fi
              for other_project in "${projects[@]}"; do
                if [ "$project" != "$other_project" ]; then
                  # Migration notes between sambanas and sambanas2 are
                  # legitimate in both directions (sambanas2 documents
                  # migration from the original add-on).
                  if { [ "$project" = "sambanas" ] && [ "$other_project" = "sambanas2" ]; } || \
                     { [ "$project" = "sambanas2" ] && [ "$other_project" = "sambanas" ]; }; then
                    continue
                  fi
                  if grep -q "\b$other_project\b" "$md_file"; then
                    echo "❌ Cross-project reference found in $md_file referencing $other_project"
                    cross_ref_found=true
                  fi
                fi
              done
            done
          done

          if [ "$cross_ref_found" = true ]; then
            echo "❌ Cross-project references detected. Each project's documentation should be self-contained."
            exit 1
          else
            echo "✅ No inappropriate cross-project references found."
          fi

      - name: Check documentation consistency
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Checking documentation consistency..."

          for project in sambanas sambanas2 plex RPiMySensor addon-plex; do
            if [ -d "$project" ] && git diff --name-only origin/${{ github.base_ref }}..HEAD | grep -q "^$project/"; then
              echo "Validating $project documentation..."
              
              # Check if README.md exists
              if [ ! -f "$project/README.md" ]; then
                echo "❌ Missing README.md in $project"
                exit 1
              fi
              
              # Check README.md has required sections
              if ! grep -q "^# " "$project/README.md"; then
                echo "❌ $project/README.md missing main title"
                exit 1
              fi
              
              # Check for maintenance mode notice in sambanas
              if [ "$project" = "sambanas" ]; then
                if ! grep -q -i "maintenance mode" "$project/README.md"; then
                  echo "❌ sambanas/README.md missing maintenance mode notice"
                  exit 1
                fi
              fi
              
              echo "✅ $project documentation structure validated"
            fi
          done
