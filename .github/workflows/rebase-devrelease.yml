name: Rebase devrelease branches

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types:
      - closed
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Target devrelease branch (e.g. devrelease/sambanas2). Empty = all devrelease/* branches."
        required: false
        default: ""
  # NOTE: anomalyco/opencode/github only supports issue_comment /
  # pull_request_review_comment events ("Unsupported event type: push" and
  # "Unsupported event type: issues"), so out-of-addon auto-resolve runs via
  # the opencode CLI (`opencode run`) in the same rebase job below — no
  # second trigger needed (GITHUB_TOKEN events don't re-trigger workflows).

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  discover:
    name: Discover targets
    # push and workflow_dispatch always run; closed PRs only when merged.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve source branch and target matrix
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TARGET: ${{ inputs.target }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${DEFAULT_BRANCH:-master}"
          echo "Source branch: ${SOURCE}"
          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"

          if [ -n "${MANUAL_TARGET}" ]; then
            case "${MANUAL_TARGET}" in
              devrelease/*) ;;
              *)
                echo "::error::target must start with 'devrelease/' (got '${MANUAL_TARGET}')"
                exit 1
                ;;
            esac
            # Verify the branch exists (API needs slashes encoded)
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "${MANUAL_TARGET}")
            if ! gh api "repos/${{ github.repository }}/branches/${ENCODED}" --silent --jq '.name' >/dev/null; then
              echo "::error::branch '${MANUAL_TARGET}' does not exist"
              exit 1
            fi
            MATRIX=$(jq -cn --arg b "${MANUAL_TARGET}" '[$b]')
          else
            BRANCHES=$(gh api "repos/${{ github.repository }}/branches?per_page=100" --paginate \
              --jq '[.[].name | select(startswith("devrelease/"))] | unique | sort | .[]' || true)
            if [ -z "${BRANCHES}" ]; then
              echo "No devrelease/* branches found."
              MATRIX="[]"
            else
              MATRIX=$(printf '%s\n' "${BRANCHES}" | jq -R . | jq -cs '.')
            fi
          fi

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Targets: ${MATRIX}"

          # Skip auto-rebase for reverts: a revert on master must never be
          # replayed onto devrelease branches. Matches the [skip rebase]
          # marker (added by the revert workflow) and Revert commits/PRs,
          # checking every commit in the push payload so merges of revert
          # PRs are covered too. Manual workflow_dispatch runs never skip.
          SKIP="false"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            MSGS=$(jq -r '[(.commits // [])[].message, (.head_commit.message // empty), (.pull_request.title // empty), (.pull_request.head.ref // empty)] | join("\n")' "$GITHUB_EVENT_PATH")
            if printf '%s\n' "${MSGS}" | grep -qiE 'skip rebase|^revert[ "'\''/:_-]'; then
              echo "Revert detected — skipping auto-rebase."
              SKIP="true"
              MATRIX="[]"
              echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"

  rebase:
    name: Rebase ${{ matrix.branch }}
    needs: discover
    if: needs.discover.outputs.skip != 'true' && needs.discover.outputs.matrix != '' && needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: rebase-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      SOURCE_BRANCH: ${{ needs.discover.outputs.source }}
      TARGET_BRANCH: ${{ matrix.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase onto source, or open fallback issue
        id: rebase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Fetching all branches..."
          git fetch origin --prune

          echo "Source: origin/${SOURCE_BRANCH}"
          echo "Target: origin/${TARGET_BRANCH}"

          git checkout "${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"

          # Nothing to do when target already contains source
          if git merge-base --is-ancestor "origin/${SOURCE_BRANCH}" HEAD; then
            echo "'${TARGET_BRANCH}' already contains 'origin/${SOURCE_BRANCH}'. Nothing to do."
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "outside_only=false" >> "$GITHUB_OUTPUT"
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Attempting: git rebase origin/${SOURCE_BRANCH}"
          if git rebase "origin/${SOURCE_BRANCH}"; then
            echo "Rebase succeeded, pushing with lease..."
            # Workspace-local tmp (opencode CLI denies /tmp as external_directory).
            REBASE_TMP="${GITHUB_WORKSPACE}/.rebase-tmp"
            mkdir -p "${REBASE_TMP}"
            export REBASE_TMP
            if git push --force-with-lease origin "${TARGET_BRANCH}" 2>&1 | tee "${REBASE_TMP}/rebase-push.log"; then
              echo "Pushed rebased '${TARGET_BRANCH}'."
              echo "conflict=false" >> "$GITHUB_OUTPUT"
              echo "outside_only=false" >> "$GITHUB_OUTPUT"
              echo "issue_number=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Rebase of '${TARGET_BRANCH}' succeeded locally but push was rejected (likely workflow-file permission)."
            PUSH_LOG="$(cat "${REBASE_TMP}/rebase-push.log" 2>/dev/null || true)"
            ADDON="${TARGET_BRANCH#devrelease/}"
            SOURCE_SHA=$(git rev-parse "origin/${SOURCE_BRANCH}" 2>/dev/null || echo "unknown")
            LOCAL_SHA=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
            REMOTE_SHA=$(git rev-parse "origin/${TARGET_BRANCH}" 2>/dev/null || echo "unknown")
            REBASED_FILES=$(git diff --name-only "origin/${TARGET_BRANCH}...HEAD" 2>/dev/null | head -n 50 || true)
            REBASED_COMMITS=$(git log --oneline "origin/${TARGET_BRANCH}..HEAD" 2>/dev/null | head -n 20 || true)
            export TARGET_BRANCH SOURCE_BRANCH ADDON SOURCE_SHA LOCAL_SHA REMOTE_SHA PUSH_LOG REBASED_FILES REBASED_COMMITS
            export EVENT_NAME RUN_ID SERVER_URL REPO
          python3 - <<'PYEOF' > "${REBASE_TMP}/rebase-push-issue.md"
          import os
          target = os.environ.get("TARGET_BRANCH", "")
          source = os.environ.get("SOURCE_BRANCH", "")
          addon = os.environ.get("ADDON", "")
          source_sha = os.environ.get("SOURCE_SHA", "unknown")
          local_sha = os.environ.get("LOCAL_SHA", "unknown")
          remote_sha = os.environ.get("REMOTE_SHA", "unknown")
          push_log = (os.environ.get("PUSH_LOG", "") or "").strip()
          files = (os.environ.get("REBASED_FILES", "") or "").strip().splitlines()
          commits = (os.environ.get("REBASED_COMMITS", "") or "").strip().splitlines()
          event_name = os.environ.get("EVENT_NAME", "")
          run_id = os.environ.get("RUN_ID", "")
          server_url = os.environ.get("SERVER_URL", "")
          repo = os.environ.get("REPO", "")
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}" if run_id else ""
          def items(vals):
              vals = [v for v in vals if v]
              return "\n".join(f"- `{v}`" for v in vals) if vals else "- _(none)_"
          print(f"Rebase of `{target}` onto `origin/{source}` (`{source_sha}`) succeeded locally, but the push was rejected (trigger: {event_name}, run {run_id}: {run_url}). This is NOT a rebase conflict - the rebased branch just needs a manual push with the right permissions.")
          print("")
          print(f"Only `{target}` needs fixing - `{source}` is untouched.")
          print("")
          print(f"> ⚠️ All work MUST happen on `{target}` (`devrelease/*`) - NEVER commit to, push to, or force-push `{source}`, `master`, or `main`.")
          print("")
          print("## Push detail")
          print("")
          print(f"- Target addon: `{addon}`")
          print(f"- Source SHA: `{source_sha}` / local rebased SHA: `{local_sha}` / remote SHA: `{remote_sha}`")
          print("- Rebased commits (local, not yet pushed):")
          print(items(commits))
          print("- Changed files (remote...local):")
          print(items(files))
          print("- Push output:")
          print("```")
          print(push_log if push_log else "(no push output captured)")
          print("```")
          print("")
          print("GITHUB_TOKEN cannot push `.github/workflows/` files (no `workflows` permission for tokens in workflow files - PAT-only scope). If the push output mentions `refusing to allow a GitHub App to create or update workflow`, push manually with a PAT that has the `workflow` scope (or as a human with rights):")
          print("")
          print("```bash")
          print("git fetch origin")
          print(f"git checkout {target}")
          print(f"# if your local {target} already has the rebased commits, just push; otherwise rebase first:")
          print(f"git rebase origin/{source}")
          print(f"git push --force-with-lease origin {target}")
          print("```")
          print("")
          print(f"This issue can be closed once `{target}` contains `origin/{source}`.")
          PYEOF
            ISSUE_TITLE="Rebase push blocked: ${TARGET_BRANCH} needs manual push with workflows permission"
            LABEL="rebase-conflict"
            gh label create "${LABEL}" \
              --description "Automatic rebase of a devrelease branch failed with conflicts" \
              --color "D93F0B" 2>/dev/null || true
            EXISTING_NUM=$(gh issue list \
              --label "${LABEL}" \
              --state open \
              --search "${ISSUE_TITLE} in:title" \
              --json number \
              --jq '.[0].number // empty')
            if [ -n "${EXISTING_NUM}" ]; then
              echo "::notice::Open push-blocked issue #${EXISTING_NUM} already exists for '${TARGET_BRANCH}'."
              gh issue comment "${EXISTING_NUM}" --body-file "${REBASE_TMP}/rebase-push-issue.md"
              ISSUE_NUM="${EXISTING_NUM}"
            else
              ISSUE_URL=$(gh issue create \
                --title "${ISSUE_TITLE}" \
                --label "${LABEL}" \
                --body-file "${REBASE_TMP}/rebase-push-issue.md")
              echo "Created: ${ISSUE_URL}"
              ISSUE_NUM=$(printf '%s' "${ISSUE_URL}" | grep -oE '[0-9]+$' || true)
            fi
            {
              echo "conflict=false"
              echo "outside_only=false"
              echo "issue_number=${ISSUE_NUM}"
            } >> "$GITHUB_OUTPUT"
            echo "::error::Rebase push blocked — #${ISSUE_NUM} left open for manual push with workflows permission."
            exit 1
          fi

          echo "::warning::Rebase of '${TARGET_BRANCH}' onto 'origin/${SOURCE_BRANCH}' failed with conflicts."

          # ---- Conflict detail (captured BEFORE abort, while index holds U entries) ----
          CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
          if [ -z "${CONFLICT_FILES}" ]; then
            CONFLICT_FILES=$(git status --porcelain 2>/dev/null | awk '$1 ~ /U|AA|DD/ {print $2}' || true)
          fi
          if [ -z "${CONFLICT_FILES}" ]; then
            CONFLICT_FILES="(unlisted - see run logs)"
          fi
          echo "Conflicted files:"
          printf '%s\n' "${CONFLICT_FILES}"

          # Target addon is the suffix of devrelease/<addon>.
          # A file is in-scope when it lives under <addon>/, out-of-scope otherwise.
          ADDON="${TARGET_BRANCH#devrelease/}"
          SOURCE_SHA=$(git rev-parse "origin/${SOURCE_BRANCH}" 2>/dev/null || echo "unknown")
          TARGET_SHA=$(git rev-parse "origin/${TARGET_BRANCH}" 2>/dev/null || echo "unknown")

          INSIDE_N=0
          OUTSIDE_N=0
          TOTAL_N=0
          INSIDE_LIST=""
          OUTSIDE_LIST=""
          while IFS= read -r F; do
            [ -z "${F}" ] && continue
            if [ "${F}" = "(unlisted - see run logs)" ]; then
              continue
            fi
            TOTAL_N=$((TOTAL_N + 1))
            case "${F}" in
              "${ADDON}/"*)
                INSIDE_N=$((INSIDE_N + 1))
                INSIDE_LIST="${INSIDE_LIST}${F}
          "
                ;;
              *)
                OUTSIDE_N=$((OUTSIDE_N + 1))
                OUTSIDE_LIST="${OUTSIDE_LIST}${F}
          "
                ;;
            esac
          done <<< "${CONFLICT_FILES}"

          if [ "${TOTAL_N}" -gt 0 ] && [ "${INSIDE_N}" -eq 0 ]; then
            OUTSIDE_ONLY="true"
          else
            OUTSIDE_ONLY="false"
          fi
          echo "Addon: ${ADDON} | total=${TOTAL_N} inside=${INSIDE_N} outside=${OUTSIDE_N} outside_only=${OUTSIDE_ONLY}"

          git rebase --abort || true

          export TARGET_BRANCH SOURCE_BRANCH SOURCE_SHA TARGET_SHA ADDON
          export TOTAL_N INSIDE_N OUTSIDE_N OUTSIDE_ONLY
          export CONFLICT_FILES INSIDE_LIST OUTSIDE_LIST
          export EVENT_NAME RUN_ID SERVER_URL REPO
          # Workspace-local tmp (opencode CLI denies /tmp as external_directory).
          REBASE_TMP="${GITHUB_WORKSPACE}/.rebase-tmp"
          mkdir -p "${REBASE_TMP}"
          export REBASE_TMP
          python3 - <<'PYEOF' > "${REBASE_TMP}/rebase-issue.md"
          import os
          target = os.environ.get("TARGET_BRANCH", "")
          source = os.environ.get("SOURCE_BRANCH", "")
          addon = os.environ.get("ADDON", "")
          source_sha = os.environ.get("SOURCE_SHA", "unknown")
          target_sha = os.environ.get("TARGET_SHA", "unknown")
          total = os.environ.get("TOTAL_N", "0")
          inside_n = os.environ.get("INSIDE_N", "0")
          outside_n = os.environ.get("OUTSIDE_N", "0")
          outside_only = os.environ.get("OUTSIDE_ONLY", "false")
          inside_list = (os.environ.get("INSIDE_LIST", "") or "").strip().splitlines()
          outside_list = (os.environ.get("OUTSIDE_LIST", "") or "").strip().splitlines()
          conflict_files = (os.environ.get("CONFLICT_FILES", "") or "").strip().splitlines()
          event_name = os.environ.get("EVENT_NAME", "")
          run_id = os.environ.get("RUN_ID", "")
          server_url = os.environ.get("SERVER_URL", "")
          repo = os.environ.get("REPO", "")
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}" if run_id else ""
          def items(files):
              files = [f for f in files if f]
              return "\n".join(f"- `{f}`" for f in files) if files else "- _(none)_"
          print(f"Automatic rebase of `{target}` onto `origin/{source}` (`{source_sha}`) failed with conflicts (trigger: {event_name}, run {run_id}: {run_url}).")
          print("")
          print(f"Only `{target}` needs fixing - `{source}` is untouched.")
          print("")
          print(f"> ⚠️ All resolution work MUST happen on `{target}` (`devrelease/*`) - NEVER commit to, push to, or force-push `{source}`, `master`, or `main`. The source branch is strictly read-only for this sync.")
          print("")
          print("## Conflict detail")
          print("")
          print(f"- Target addon (from `{target}`): `{addon}`")
          print(f"- Source SHA: `{source_sha}` / target SHA (origin): `{target_sha}`")
          print(f"- Conflicted files ({total}):")
          print(items(conflict_files))
          print(f"- Inside `{addon}/` ({inside_n} - needs manual review):")
          print(items(inside_list))
          print(f"- Outside `{addon}/` ({outside_n} - generic files):")
          print(items(outside_list))
          print(f"- All conflicts outside target addon: `{outside_only}`")
          print("")
          if outside_only == "true":
              print("All conflicts are outside the target addon directory, so this run attempts an opencode-assisted rebase via the CLI right below. It pushes only on a 100% functional resolution; on any doubt it stops and comments here, leaving this issue open for manual sync.")
          else:
              print("At least one conflict touches the target addon directory, so automatic resolution is disabled. Please resolve manually on the target branch (the bot stops on any doubt for in-addon files).")
          print("")
          print("<!-- rebase-meta target=%s source=%s addon=%s outside_only=%s source_sha=%s target_sha=%s -->" % (target, source, addon, outside_only, source_sha, target_sha))
          print("")
          print("Please resolve manually on the `%s` branch:" % target)
          print("")
          print("```bash")
          print("git fetch origin")
          print(f"git checkout {target}")
          print(f"git rebase origin/{source}")
          print("# resolve conflicts, keeping the devrelease-specific changes, then:")
          print("git rebase --continue")
          print(f"git push --force-with-lease origin {target}")
          print("```")
          print("")
          print(f"This issue can be closed once `{target}` contains `origin/{source}`.")
          PYEOF

          ISSUE_TITLE="Rebase conflict: ${TARGET_BRANCH} needs manual sync with ${SOURCE_BRANCH}"
          LABEL="rebase-conflict"

          echo "Ensuring label '${LABEL}' exists..."
          gh label create "${LABEL}" \
            --description "Automatic rebase of a devrelease branch failed with conflicts" \
            --color "D93F0B" 2>/dev/null || true

          echo "Checking for an existing open issue '${ISSUE_TITLE}'..."
          EXISTING_NUM=$(gh issue list \
            --label "${LABEL}" \
            --state open \
            --search "${ISSUE_TITLE} in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${EXISTING_NUM}" ]; then
            echo "::notice::Open sync issue #${EXISTING_NUM} already exists for '${TARGET_BRANCH}'. Adding fresh conflict detail."
            gh issue comment "${EXISTING_NUM}" --body-file "${REBASE_TMP}/rebase-issue.md"
            ISSUE_NUM="${EXISTING_NUM}"
          else
            echo "Creating fallback issue for '${TARGET_BRANCH}'..."
            ISSUE_URL=$(gh issue create \
              --title "${ISSUE_TITLE}" \
              --label "${LABEL}" \
              --body-file "${REBASE_TMP}/rebase-issue.md")
            echo "Created: ${ISSUE_URL}"
            ISSUE_NUM=$(printf '%s' "${ISSUE_URL}" | grep -oE '[0-9]+$' || true)
          fi

          # Publish state for the opencode CLI steps below in this same job.
          # The workspace is left clean on the target branch (post-abort); the
          # resolve step re-runs the rebase itself to reproduce conflicts.
          # Never exit 1 here: the verify step decides the job outcome so the
          # CLI resolution always gets its chance on outside-only conflicts.
          {
            echo "conflict=true"
            echo "outside_only=${OUTSIDE_ONLY}"
            echo "issue_number=${ISSUE_NUM}"
            echo "addon=${ADDON}"
            echo "source_sha=${SOURCE_SHA}"
            echo "conflict_files<<REBASE_EOF"
            printf '%s\n' "${CONFLICT_FILES}"
            echo "REBASE_EOF"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "${ISSUE_NUM}" > "${REBASE_TMP}/rebase-issue-number"
          printf '%s' "${CONFLICT_FILES}" > "${REBASE_TMP}/rebase-conflict-files"
          echo "::warning::Rebase conflict — fallback issue #${ISSUE_NUM} for '${TARGET_BRANCH}' (outside_only=${OUTSIDE_ONLY})."
          exit 0

      # Same-run auto-resolve (no second trigger): the rebase step above left
      # the workspace clean on the target branch and published conflict state
      # as step outputs. Only outside-addon conflicts are attempted, via the
      # opencode CLI (the anomalyco/opencode/github action rejects push AND
      # issues events, so it can never run in this workflow).
      - name: Mask secrets for auto-resolve
        if: steps.rebase.outputs.conflict == 'true'
        shell: bash
        run: |
          echo "::add-mask::${{ secrets.OPENCODE_API_KEY }}"
          echo "::add-mask::${{ secrets.GITHUB_TOKEN }}"

      - name: Stop on in-addon conflicts (manual sync needed)
        if: steps.rebase.outputs.conflict == 'true' && steps.rebase.outputs.outside_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.rebase.outputs.issue_number }}
          ADDON: ${{ steps.rebase.outputs.addon }}
        shell: bash
        run: |
          set -uo pipefail
          REBASE_TMP="${GITHUB_WORKSPACE}/.rebase-tmp"
          LIST=$(sed 's/^/- `/' "${REBASE_TMP}/rebase-conflict-files" | sed 's/$/`/' | head -n 50)
          gh issue comment "${ISSUE_NUMBER}" --body "Auto-resolve stopped: at least one conflicted file is inside the target addon directory \`${ADDON}/\`, so no automatic fix was attempted (only 100% safe out-of-addon resolutions are allowed).

          Conflicted files:

          ${LIST}

          Please resolve manually on \`${TARGET_BRANCH}\`:

          \`\`\`bash
          git fetch origin
          git checkout ${TARGET_BRANCH}
          git rebase origin/${SOURCE_BRANCH}
          # resolve conflicts, keeping the devrelease-specific changes, then:
          git rebase --continue
          git push --force-with-lease origin ${TARGET_BRANCH}
          \`\`\`"
          echo "::notice::In-addon conflicts - left #${ISSUE_NUMBER} open for manual sync."

      - name: Select model for auto-resolve
        if: steps.rebase.outputs.conflict == 'true' && steps.rebase.outputs.outside_only == 'true'
        id: model
        uses: dianlight/opencode-modelselect-action@97f7f5c377aae0f922a08222d433b1eb0475bddf # v1
        with:
          task-type: code
          tier: auto
          opencode-token: ${{ secrets.OPENCODE_API_KEY }}

      - name: Resolve rebase conflicts via opencode CLI
        if: steps.rebase.outputs.conflict == 'true' && steps.rebase.outputs.outside_only == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ steps.model.outputs.model }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.rebase.outputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          echo "::add-mask::${OPENCODE_API_KEY}"
          echo "::add-mask::${GH_TOKEN}"

          git fetch origin --prune
          git checkout "${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"

          ADDON="${TARGET_BRANCH#devrelease/}"
          SOURCE_SHA=$(git rev-parse "origin/${SOURCE_BRANCH}" 2>/dev/null || echo "unknown")
          export TARGET_BRANCH SOURCE_BRANCH ADDON SOURCE_SHA ISSUE_NUMBER RUN_ID SERVER_URL REPO
          # Workspace-local tmp (opencode CLI denies /tmp as external_directory).
          REBASE_TMP="${GITHUB_WORKSPACE}/.rebase-tmp"
          mkdir -p "${REBASE_TMP}"
          export REBASE_TMP
          python3 - <<'PYEOF' > "${REBASE_TMP}/rebase-prompt.md"
          import os
          target = os.environ.get("TARGET_BRANCH", "")
          source = os.environ.get("SOURCE_BRANCH", "")
          addon = os.environ.get("ADDON", "")
          source_sha = os.environ.get("SOURCE_SHA", "unknown")
          issue = os.environ.get("ISSUE_NUMBER", "")
          run_id = os.environ.get("RUN_ID", "")
          server_url = os.environ.get("SERVER_URL", "")
          repo = os.environ.get("REPO", "")
          rebase_tmp = os.environ.get("REBASE_TMP", "./.rebase-tmp")
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}" if run_id else ""
          try:
              with open(os.path.join(rebase_tmp, "rebase-conflict-files")) as f:
                  files = [l.strip() for l in f if l.strip()]
          except OSError:
              files = []
          items = "\n".join(f"- `{f}`" for f in files) if files else "- _(none)_"
          print("You are resolving a git rebase conflict for a Home Assistant add-ons monorepo. You run non-interactively in the repo root; git credentials and author identity are already configured.")
          print("")
          print("Context:")
          print(f"- Target branch needing the fix: `{target}` (the SOURCE branch is untouched; fix only the target).")
          print(f"- Source to rebase onto: `origin/{source}` (SHA `{source_sha}`).")
          print(f"- Target addon directory: `{addon}/`.")
          print(f"- Proven fact: EVERY conflicted file is OUTSIDE `{addon}/` (generic repo files). Conflicted files:")
          print(items)
          print(f"- Related issue: #{issue}. Run: {run_url}")
          print("")
          print("Task:")
          print(f"1. `git rebase origin/{source}` to reproduce the conflicts (workspace is already on `{target}`, reset to `origin/{target}`).")
          print(f"2. Resolve each conflicted file by understanding both sides. For generic files outside the addon directory, prefer `origin/{source}` unless that would clearly drop devrelease intent. Never invent behavior; preserve devrelease-specific changes.")
          print("3. `git add` the resolved files and `git rebase --continue` until the rebase is clean.")
          print(f"4. Verify with `git merge-base --is-ancestor origin/{source} HEAD`.")
          print(f"5. Only then `git push --force-with-lease origin {target}`.")
          print("")
          print("FILESYSTEM SCOPE (binding):")
          print("- NEVER read from, write to, or create files under `/tmp` (the tool sandbox denies it as external_directory and the run fails).")
          print(f"- Use only workspace-local paths: repo root and `{rebase_tmp}/` for any scratch/diff files you need.")
          print("")
          print("BRANCH SCOPE (binding, overrides everything else):")
          print(f"- Do ALL work on `{target}`. Push ONLY to `origin/{target}` with `--force-with-lease`.")
          print(f"- NEVER commit to, push to, or force-push `master`, `main`, `origin/master`, `origin/main`, or `origin/{source}`. Treat the source branch as strictly read-only (`git fetch` + rebase onto it only).")
          print("- If supporting plumbing proposes a PR against `master`/`main`, do NOT follow it - resolve directly on the devrelease branch as instructed above.")
          print("")
          print("STRICT CORRECTNESS RULE (binding):")
          print("- Push ONLY on a 100% functional and correct resolution.")
          print("- On ANY doubt about semantics, behavior, or intent: STOP. Do NOT push. Run `git rebase --abort` to leave the working tree clean, and explain in your final response exactly which file/hunk is doubtful and why, so the workflow can post it as an issue comment and keep the issue open for a human.")
          print("- On success, end your response with a `MERGED:` summary listing what was rebased (source SHA), which files you resolved and how (one line per file), and the verification command output.")
          PYEOF
          echo "--- Prompt ---"
          cat "${REBASE_TMP}/rebase-prompt.md"

          if ! command -v opencode >/dev/null; then
            echo "opencode CLI not found, installing..."
            curl -fsSL https://opencode.ai/install | bash
            export PATH="${HOME}/.opencode/bin:${PATH}"
          fi

          # The agent resolves the rebase and pushes itself on success; on any
          # doubt it must stop WITHOUT pushing. Never fail here: the verify
          # step below decides comment/close/exit code.
          OPENCODE_DISABLE_AUTOUPDATE="true" opencode run \
            --model "${OPENCODE_MODEL}" \
            --agent build \
            "$(cat "${REBASE_TMP}/rebase-prompt.md")" 2>&1 | tee "${REBASE_TMP}/rebase-opencode.log" || true
          echo "--- opencode run finished ---"
          tail -n 30 "${REBASE_TMP}/rebase-opencode.log" || true

      - name: Verify auto-resolve outcome
        if: steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.rebase.outputs.issue_number }}
          OUTSIDE_ONLY: ${{ steps.rebase.outputs.outside_only }}
          ADDON: ${{ steps.rebase.outputs.addon }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin --prune
          # The opencode CLI agent pushes directly to the target branch.
          if git merge-base --is-ancestor "origin/${SOURCE_BRANCH}" "origin/${TARGET_BRANCH}"; then
            SOURCE_SHA=$(git rev-parse "origin/${SOURCE_BRANCH}")
            TARGET_SHA=$(git rev-parse "origin/${TARGET_BRANCH}")
            MERGED_FILES=$(git diff --name-only "${SOURCE_SHA}~1" "${TARGET_SHA}" 2>/dev/null | head -n 30 || git log --oneline "${SOURCE_SHA}..${TARGET_SHA}" | head -n 20)
            gh issue comment "${ISSUE_NUMBER}" --body "Auto-resolve succeeded: opencode rebased \`${TARGET_BRANCH}\` onto \`origin/${SOURCE_BRANCH}\` (\`${SOURCE_SHA}\`) and pushed (all conflicts were outside \`${ADDON}/\`). New \`${TARGET_BRANCH}\` SHA: \`${TARGET_SHA}\`.

            Changed/merged files (first 30):
            $(printf '%s\n' "${MERGED_FILES}" | sed 's/^/- `/;s/$/`/')
            - Run: ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
            gh issue close "${ISSUE_NUMBER}" --reason completed
            echo "Closed #${ISSUE_NUMBER} as resolved."
            exit 0
          fi
          # Still unmerged: the in-addon case was already commented by the stop
          # step, so only post fresh detail for the attempted CLI run.
          if [ "${OUTSIDE_ONLY}" = "true" ]; then
            git checkout "${TARGET_BRANCH}" 2>/dev/null || true
            git reset --hard "origin/${TARGET_BRANCH}" 2>/dev/null || true
            REMAINING=""
            if ! git rebase "origin/${SOURCE_BRANCH}" >/dev/null 2>&1; then
              REMAINING=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              git rebase --abort || true
            fi
            if [ -n "${REMAINING}" ]; then
              LIST=$(printf '%s\n' "${REMAINING}" | sed 's/^/- `/' | sed 's/$/`/')
            else
              LIST="- (could not determine - see [run log](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}))"
            fi
            gh issue comment "${ISSUE_NUMBER}" --body "Auto-resolve stopped with doubts: opencode did NOT push a resolution (correctness rule), or the push did not land. \`${TARGET_BRANCH}\` still does not contain \`origin/${SOURCE_BRANCH}\`. The issue stays open for manual sync.

            Remaining conflicted files (re-checked):

            ${LIST}

            The opencode log tail is in the [run log](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}). To finish manually:

            \`\`\`bash
            git fetch origin
            git checkout ${TARGET_BRANCH}
            git rebase origin/${SOURCE_BRANCH}
            # resolve conflicts, keeping the devrelease-specific changes, then:
            git rebase --continue
            git push --force-with-lease origin ${TARGET_BRANCH}
            \`\`\`"
          fi
          echo "::error::Rebase conflict — #${ISSUE_NUMBER} left open for manual sync."
          exit 1
