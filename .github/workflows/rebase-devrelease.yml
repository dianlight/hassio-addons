name: Rebase devrelease branches

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types:
      - closed
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Target devrelease branch (e.g. devrelease/sambanas2). Empty = all devrelease/* branches."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  discover:
    name: Discover targets
    # push and workflow_dispatch always run; closed PRs only when merged
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve source branch and target matrix
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TARGET: ${{ inputs.target }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${DEFAULT_BRANCH:-master}"
          echo "Source branch: ${SOURCE}"
          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"

          if [ -n "${MANUAL_TARGET}" ]; then
            case "${MANUAL_TARGET}" in
              devrelease/*) ;;
              *)
                echo "::error::target must start with 'devrelease/' (got '${MANUAL_TARGET}')"
                exit 1
                ;;
            esac
            # Verify the branch exists (API needs slashes encoded)
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "${MANUAL_TARGET}")
            if ! gh api "repos/${{ github.repository }}/branches/${ENCODED}" --jq '.name' >/dev/null; then
              echo "::error::branch '${MANUAL_TARGET}' does not exist"
              exit 1
            fi
            MATRIX=$(jq -cn --arg b "${MANUAL_TARGET}" '[$b]')
          else
            BRANCHES=$(gh api "repos/${{ github.repository }}/branches?per_page=100" --paginate \
              --jq '[.[].name | select(startswith("devrelease/"))] | unique | sort | .[]' || true)
            if [ -z "${BRANCHES}" ]; then
              echo "No devrelease/* branches found."
              MATRIX="[]"
            else
              MATRIX=$(printf '%s\n' "${BRANCHES}" | jq -R . | jq -cs '.')
            fi
          fi

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Targets: ${MATRIX}"

          # Skip auto-rebase for reverts: a revert on master must never be
          # replayed onto devrelease branches. Matches the [skip rebase]
          # marker (added by the revert workflow) and Revert commits/PRs,
          # checking every commit in the push payload so merges of revert
          # PRs are covered too. Manual workflow_dispatch runs never skip.
          SKIP="false"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            MSGS=$(jq -r '[(.commits // [])[].message, (.head_commit.message // empty), (.pull_request.title // empty), (.pull_request.head.ref // empty)] | join("\n")' "$GITHUB_EVENT_PATH")
            if printf '%s\n' "${MSGS}" | grep -qiE 'skip rebase|^revert[ "'\''/:_-]'; then
              echo "Revert detected — skipping auto-rebase."
              SKIP="true"
              MATRIX="[]"
              echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"

  rebase:
    name: Rebase ${{ matrix.branch }}
    needs: discover
    if: needs.discover.outputs.skip != 'true' && needs.discover.outputs.matrix != '' && needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: rebase-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      SOURCE_BRANCH: ${{ needs.discover.outputs.source }}
      TARGET_BRANCH: ${{ matrix.branch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase onto source, or open fallback issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Fetching all branches..."
          git fetch origin --prune

          echo "Source: origin/${SOURCE_BRANCH}"
          echo "Target: origin/${TARGET_BRANCH}"

          git checkout "${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"

          # Nothing to do when target already contains source
          if git merge-base --is-ancestor "origin/${SOURCE_BRANCH}" HEAD; then
            echo "'${TARGET_BRANCH}' already contains 'origin/${SOURCE_BRANCH}'. Nothing to do."
            exit 0
          fi

          echo "Attempting: git rebase origin/${SOURCE_BRANCH}"
          if git rebase "origin/${SOURCE_BRANCH}"; then
            echo "Rebase succeeded, pushing with lease..."
            git push --force-with-lease origin "${TARGET_BRANCH}"
            echo "Pushed rebased '${TARGET_BRANCH}'."
            exit 0
          fi

          echo "::warning::Rebase of '${TARGET_BRANCH}' onto 'origin/${SOURCE_BRANCH}' failed with conflicts."
          git rebase --abort || true

          ISSUE_TITLE="Rebase conflict: ${TARGET_BRANCH} needs manual sync with ${SOURCE_BRANCH}"
          LABEL="rebase-conflict"

          echo "Ensuring label '${LABEL}' exists..."
          gh label create "${LABEL}" \
            --description "Automatic rebase of a devrelease branch failed with conflicts" \
            --color "D93F0B" 2>/dev/null || true

          echo "Checking for an existing open issue '${ISSUE_TITLE}'..."
          EXISTING=$(gh issue list \
            --label "${LABEL}" \
            --state open \
            --search "${ISSUE_TITLE} in:title" \
            --json number,url \
            --jq 'length')

          if [ "${EXISTING}" -gt 0 ]; then
            gh issue list --label "${LABEL}" --state open --search "${ISSUE_TITLE} in:title"
            echo "::notice::Open sync issue already exists for '${TARGET_BRANCH}'. Skipping creation."
            exit 1
          fi

          echo "Creating fallback issue for '${TARGET_BRANCH}'..."
          SOURCE_SHA=$(git rev-parse "origin/${SOURCE_BRANCH}")
          gh issue create \
            --title "${ISSUE_TITLE}" \
            --label "${LABEL}" \
            --body "Automatic rebase of \`${TARGET_BRANCH}\` onto \`origin/${SOURCE_BRANCH}\` (\`${SOURCE_SHA}\`) failed with conflicts (trigger: ${{ github.event_name }}, run ${{ github.run_id }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Only \`${TARGET_BRANCH}\` needs fixing — \`${SOURCE_BRANCH}\` is untouched.

          Please resolve manually on the \`${TARGET_BRANCH}\` branch:

          \`\`\`bash
          git fetch origin
          git checkout ${TARGET_BRANCH}
          git rebase origin/${SOURCE_BRANCH}
          # resolve conflicts, keeping the devrelease-specific changes, then:
          git rebase --continue
          git push --force-with-lease origin ${TARGET_BRANCH}
          \`\`\`

          This issue can be closed once \`${TARGET_BRANCH}\` contains \`origin/${SOURCE_BRANCH}\`."

          echo "::error::Rebase conflict — fallback issue created for '${TARGET_BRANCH}'."
          exit 1
