name: OpenCode Changelog (sambanas2)

# No /oc text commands. Automatic only: push + pull_request + manual dispatch.
# Model is resolved via dianlight/opencode-modelselect-action (task-type: docs).
# Auth uses OPENCODE_API_KEY (never ANTHROPIC_API_KEY).
#
# NOTE: anomalyco/opencode/github only supports issue/PR/schedule/dispatch
# events ("Unsupported event type: push"), so push/dispatch runs use the
# opencode CLI directly (opencode run), locked down to one file via permissions.

on:
  push:
    branches:
      - devrelease/*
      - mergerelease/*
    paths:
      - sambanas2/**
  pull_request:
    paths:
      - sambanas2/**
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: "maintain (default) or strip-unreleased (mergerelease/beta sync)"
        required: false
        default: maintain

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # push + dispatch: headless CLI run (the github wrapper action rejects push).
  changelog-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: true

      # Defense in depth: secrets.* are auto-masked, but an explicit mask also
      # covers failure dumps (e.g. a crashing tool printing its environment).
      - name: Mask secrets in logs
        shell: bash
        run: |
          echo "::add-mask::${{ secrets.OPENCODE_API_KEY }}"
          echo "::add-mask::${{ secrets.GITHUB_TOKEN }}"

      - name: Fetch SRAT changelog for AI curation
        working-directory: sambanas2
        shell: bash
        run: |
          SRAT_VERSION=$(grep -m1 'ARG SRAT_VERSION=' Dockerfile | cut -d= -f2 | tr -d '"')
          echo "SRAT_VERSION=$SRAT_VERSION"
          curl --silent --fail --location \
            "https://raw.githubusercontent.com/dianlight/srat/${SRAT_VERSION}/CHANGELOG.md" \
            -o /tmp/srat-CHANGELOG.md \
            && echo "SRAT changelog fetched." \
            || echo "::warning::Could not fetch SRAT changelog for $SRAT_VERSION; AI will note the version without curated items."

      - name: Select model
        id: resolve
        uses: dianlight/opencode-modelselect-action@v1
        with:
          task-type: docs
          tier: auto
          opencode-token: ${{ secrets.OPENCODE_API_KEY }}

      - name: Install opencode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Maintain CHANGELOG.md via CLI
        # mergerelease/* is deterministic-only (strip ## Unreleased already done
        # in docker-image-dev): never re-add Unreleased there, and avoid push loops.
        if: inputs.mode != 'strip-unreleased' && !startsWith(github.ref, 'refs/heads/mergerelease/')
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        timeout-minutes: 10
        shell: bash
        run: |
          cat > /tmp/changelog-prompt.txt <<'PROMPT_EOF'
          Maintain ONLY sambanas2/CHANGELOG.md ## Unreleased per sambanas2/.changelog-style.md
          (emoji sections, RC versions, no dates; config.yaml:version is source of truth).
          You run non-interactively in the repo root. Edit that one file only; do not commit.
          Steps:
          1. Diff origin/master...HEAD scoped to sambanas2/ (features, fixes, chores, breaking, migration notes).
          2. SRAT (no dedicated section, ever):
             - Read Dockerfile ARG SRAT_VERSION; the full upstream notes are at
               /tmp/srat-CHANGELOG.md (fetched by the previous step; fall back to
               https://raw.githubusercontent.com/dianlight/srat/<ver>/CHANGELOG.md).
             - Add ONE Chore bullet referencing the version with a link to the full log:
               `- Update SRAT to [v<ver>](https://github.com/dianlight/srat/blob/<ver>/CHANGELOG.md)`.
             - Report only important user-facing SRAT changes inside the normal
               ### ✨ Features / ### 🐛 Bug Fixes sections, each suffixed with
               `(from SRAT v<ver>)`. Drop internal churn, Thanks/Roadmap noise and
               duplicates of add-on bullets. If the SRAT fetch failed, keep just
               the Chore version bullet.
             - Never create a ### 🐭 Features from SRAT section.
          3. Version rules (C=config.yaml:version, H=first ## != Unreleased):
             - C==H: append to ## Unreleased only (Us1/Us4). Never bump versions here.
             - C not in file + Unreleased non-empty: promote Unreleased -> ## C, leave new empty ## Unreleased (Us2/Us3).
             - C in older ##: no duplication; ensure ## Unreleased exists.
             - Never create -beta/-dev headers here; never add/remove ## Unreleased in a way that leaves two heads.
          4. Section order: in the first versioned release put ### 🙏 Thanks first
             and ### 🚨 Notes second (a deterministic step re-sorts them anyway).
          5. Keep it concise and user-facing. Do not touch config.yaml, Dockerfile, or translations.
          PROMPT_EOF
          opencode run --model "${{ steps.resolve.outputs.model }}" --agent build "$(cat /tmp/changelog-prompt.txt)"

      - name: Normalize Thanks/Notes order (deterministic)
        shell: bash
        run: |
          python3 sambanas2/scripts/normalize_changelog_order.py sambanas2/CHANGELOG.md

      - name: Commit back (push/dispatch only)
        shell: bash
        run: |
          if git diff --quiet -- sambanas2/CHANGELOG.md; then
            echo "CHANGELOG.md unchanged, nothing to commit."
            exit 0
          fi
          git config user.email "workflow-bot@github.com"
          git config user.name "Changelog Bot"
          git add sambanas2/CHANGELOG.md
          git commit -m "chore: update sambanas2 CHANGELOG.md Unreleased via opencode" || exit 0
          for i in 1 2 3; do
            git pull --rebase && git push && break || sleep 10
          done

  # pull_request: official action (push is the only unsupported event).
  changelog-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: true

      - name: Mask secrets in logs
        shell: bash
        run: |
          echo "::add-mask::${{ secrets.OPENCODE_API_KEY }}"
          echo "::add-mask::${{ secrets.GITHUB_TOKEN }}"

      - name: Fetch SRAT changelog for AI curation
        working-directory: sambanas2
        shell: bash
        run: |
          SRAT_VERSION=$(grep -m1 'ARG SRAT_VERSION=' Dockerfile | cut -d= -f2 | tr -d '"')
          echo "SRAT_VERSION=$SRAT_VERSION"
          curl --silent --fail --location \
            "https://raw.githubusercontent.com/dianlight/srat/${SRAT_VERSION}/CHANGELOG.md" \
            -o /tmp/srat-CHANGELOG.md \
            && echo "SRAT changelog fetched." \
            || echo "::warning::Could not fetch SRAT changelog for $SRAT_VERSION; AI will note the version without curated items."

      - name: Select model
        id: resolve
        uses: dianlight/opencode-modelselect-action@v1
        with:
          task-type: docs
          tier: auto
          opencode-token: ${{ secrets.OPENCODE_API_KEY }}

      - name: Maintain CHANGELOG.md
        # Pinned to a moving tag for bootstrap; pin to a reviewed SHA after first green run.
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ steps.resolve.outputs.model }}
          use_github_token: true
          # Never upload the session transcript anywhere (public repos default to share).
          share: false
          prompt: |
            Maintain ONLY sambanas2/CHANGELOG.md ## Unreleased per sambanas2/.changelog-style.md
            (emoji sections, RC versions, no dates; config.yaml:version is source of truth).
            Steps:
            1. Diff origin/master...HEAD scoped to sambanas2/ (features, fixes, chores, breaking, migration notes).
            2. SRAT (no dedicated section, ever):
               - Read Dockerfile ARG SRAT_VERSION; the full upstream notes are at
                 /tmp/srat-CHANGELOG.md (fetched by the previous step; fall back to
                 https://raw.githubusercontent.com/dianlight/srat/<ver>/CHANGELOG.md).
               - Add ONE Chore bullet referencing the version with a link to the full log:
                 `- Update SRAT to [v<ver>](https://github.com/dianlight/srat/blob/<ver>/CHANGELOG.md)`.
               - Report only important user-facing SRAT changes inside the normal
                 ### ✨ Features / ### 🐛 Bug Fixes sections, each suffixed with
                 `(from SRAT v<ver>)`. Drop internal churn, Thanks/Roadmap noise and
                 duplicates of add-on bullets. If the SRAT fetch failed, keep just
                 the Chore version bullet.
               - Never create a ### 🐭 Features from SRAT section.
            3. Version rules (C=config.yaml:version, H=first ## != Unreleased):
               - C==H: append to ## Unreleased only (Us1/Us4). Never bump versions here.
               - C not in file + Unreleased non-empty: promote Unreleased -> ## C, leave new empty ## Unreleased (Us2/Us3).
               - C in older ##: no duplication; ensure ## Unreleased exists.
               - Never create -beta/-dev headers here; never add/remove ## Unreleased in a way that leaves two heads.
               - Commit only if the head repo is this repo, else post the ready-to-paste entry as a PR comment.
            4. Section order: in the first versioned release put ### 🙏 Thanks first
               and ### 🚨 Notes second (a deterministic step re-sorts them anyway).
            5. Keep it concise and user-facing. Do not touch config.yaml, Dockerfile, or translations.

      - name: Normalize Thanks/Notes order (deterministic)
        shell: bash
        run: |
          python3 sambanas2/scripts/normalize_changelog_order.py sambanas2/CHANGELOG.md
